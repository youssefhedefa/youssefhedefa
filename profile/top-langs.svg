<svg xmlns="http://www.w3.org/2000/svg" width="495" height="311" viewBox="0 0 495 311" role="img"><title>Top Langs</title><rect x="0.5" y="0.5" width="494" height="310" rx="12" fill="#0D1117" stroke="#30363D"/><g transform="translate(1,1) scale(0.904587)"><svg
